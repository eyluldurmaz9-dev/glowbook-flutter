name: glowbook_flutter
description: Flutter client for GlowBook (scaffold)
publish_to: 'none'
environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.0.0
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^4.0.0
  flutter_riverpod: ^2.3.6
  go_router: ^7.1.0
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
